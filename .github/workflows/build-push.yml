name: Build & Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cloud-platform-container:${GITHUB_SHA::7} ./container
          docker tag ghcr.io/${{ github.repository_owner }}/cloud-platform-container:${GITHUB_SHA::7} \
                    ghcr.io/${{ github.repository_owner }}/cloud-platform-container:latest

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/platform-container:${GITHUB_SHA::7}
          docker push ghcr.io/${{ github.repository_owner }}/platform-container:latest   
